name: zbKits
description: A modern kits plugin for the Crystal PvP server.
main: dev.viper.zbkits.zbKits
version: '1.0.4'
api-version: '1.21'
folia-supported: true
website: https://xyris.fun/
authors:
  - viper@zarbunex
  - zarbunex
softdepend:
  - WorldGuard

# The per-kit permissions zbkits.kit1 ... zbkits.kitN (N = "kits" in config.yml) are registered
# when the plugin starts and default to true.
permissions:
  zbkits.admin:
    description: Admin commands (/kitsadmin, /kitroomadmin, /premadekit save, /zbkits reload)
    default: op
  zbkits.autorekit:
    description: Use /autorekit
    default: op
  zbkits.autokit:
    description: Old name of zbkits.autorekit, grants it
    default: op
    children:
      zbkits.autorekit: true
